{% comment %}
Standalone on purpose: whoever opens this is not signed in, so it cannot extend
base.html (which assumes a session, a workspace and the app chrome). Styled
inline to match the emails it is reached from.
{% endcomment %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取消订阅</title>
</head>
<body style="margin:0;padding:0;background-color:#FAFAF9;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1C1917;">
  <div style="max-width:480px;margin:0 auto;padding:48px 20px;">
    <div style="background-color:#FFFFFF;border:1px solid #E7E5E4;border-radius:12px;padding:32px;">
      <h1 style="margin:0 0 12px;font-size:20px;font-weight:700;">停止接收这些邮件？</h1>
      <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#57534E;">
        您将不再收到 <strong>{{ label }}</strong> 邮件。您仍可在应用内查看，并随时在通知偏好设置中重新开启。
      </p>
      <form method="post" action="{% url 'notifications:unsubscribe' token=token %}">
        <button type="submit"
                style="display:inline-block;padding:10px 24px;border:0;border-radius:9999px;background-color:#F97316;color:#FFFFFF;font-size:14px;font-weight:600;cursor:pointer;">
          取消订阅
        </button>
      </form>
    </div>
  </div>
</body>
</html>
