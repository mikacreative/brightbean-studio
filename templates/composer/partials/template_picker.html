<!-- Template picker modal content (loaded via HTMX) -->
<div class="space-y-3">
    {% for tpl in templates %}
    <a href="{% url 'composer:use_template' workspace_id=workspace.id template_id=tpl.id %}"
       class="block p-3 rounded-lg border border-stone-200 hover:border-stone-300 hover:bg-stone-50 transition-colors">
        <div class="flex items-center justify-between mb-1">
            <span class="text-sm font-semibold text-stone-800">{{ tpl.name }}</span>
        </div>
        {% if tpl.description %}
        <p class="text-xs text-stone-500 line-clamp-1">{{ tpl.description }}</p>
        {% endif %}
        {% if tpl.template_data.caption %}
        <p class="text-xs text-stone-400 mt-1 line-clamp-1 font-mono">{{ tpl.template_data.caption|truncatechars:80 }}</p>
        {% endif %}
    </a>
    {% empty %}
    <div class="text-center py-8">
        <p class="text-sm text-stone-500">暂无模板。</p>
        <p class="text-xs text-stone-400 mt-1">将内容保存为模板即可在此处查看。</p>
    </div>
    {% endfor %}
</div>
